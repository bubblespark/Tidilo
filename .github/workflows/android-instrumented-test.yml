name: Manual Android Instrumented Tests

on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Test class to run (if left blank, all tests will be run; example: me.bubblespark.tidilo.ExampleInstrumentedTest)'
        required: false
        default: ''
      api_level:
        description: 'Emulator API level (minSdk=34 / targetSdk=36)'
        type: choice
        options:
          - '36'
          - '35'
          - '34'
        default: '36'

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    # To prevent a GradleException from occurring in the `signingConfigs` section of `app/build.gradle.kts` when `CI==“true”` and the keystore is not configured,
    # override it to `false` when running debug tests.
    env:
      CI: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx2g" ${{ inputs.test_class != '' && format('-Pandroid.testInstrumentationRunnerArguments.class={0}', inputs.test_class) || '' }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-api-${{ inputs.api_level }}
          path: app/build/reports/androidTests/connected/
          retention-days: 7
